name: Deploy to desavanja-aquana.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy via HTTPS Webhook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Static Export
        run: npm run build

      - name: Package Build Output
        run: |
          cd out
          zip -r ../deploy-package.zip . -x "dokumenti/*"
          cd ..

      - name: Deploy to Server via Webhook
        run: |
          curl -f -s -S -X POST \
            -F "token=aquana_secure_deploy_2026_blip_99" \
            -F "package=@deploy-package.zip" \
            http://desavanja-aquana.com/api-deploy-hook.php
