<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sajt je u izradi ? JP AQUANA Banja Luka</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, #0c2d48, #031424 85%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      max-width: 620px;
      width: 100%;
      padding: 48px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .logo {
      height: 64px;
      width: auto;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 12px rgba(14, 165, 233, 0.4));
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(14, 165, 233, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 17px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 28px 0;
    }
    .contact-info {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.8;
    }
    .contact-info strong {
      color: #38bdf8;
    }
    .footer-note {
      margin-top: 32px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/images/logo.png" alt="JP Aquana Banja Luka" class="logo" />
    <br />
    <div class="badge">JP ?AQUANA? d.o.o. Banja Luka</div>
    <h1>Sajt je u izradi</h1>
    <p class="subtitle">Uskoro dostupno ? JP Aquana Banja Luka</p>
    
    <div class="divider"></div>
    
    <div class="contact-info">
      <div>Gradski olimpijski bazen (GOB) ? Vodeni park Aquana</div>
      <div>Uprava / Centrala: <strong>+387 (0) 51 456 230</strong></div>
      <div>Recepcija GOB: <strong>+387 (0) 51 456 450</strong></div>
      <div>E-mail: <strong>info@aquana.ba</strong></div>
    </div>
  </div>
  
  <div class="footer-note">
    ? 2026 JP ?Aquana? d.o.o. Banja Luka ? Sva prava zadr?ana.
  </div>
</body>
</html>
